<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 1인 회사</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== 화면 1: 회사 지도 ===== -->
  <section id="map-screen" class="screen">

    <!-- 맨 위 상태 바. 왼쪽부터: 상태 요약 | 날짜(요일) | 레벨·경험치 | 오늘 기록 | 안내 문구
         글자 내용은 app.js의 renderStatus()가 채운다. 채우기 전에는 "----------" 만 보인다. -->
    <header class="status-bar">
      <span class="status-item status-summary" id="status-summary">----------</span>
      <span class="status-item" id="today-date">----------</span>
      <span class="status-item status-level">
        <span class="level-badge">Lv.<span id="level">-</span></span>
        <span class="xp-bar"><span class="xp-fill" id="xp-fill"></span></span>
        <span class="xp-text" id="xp-text">- / 100</span>
      </span>
      <span class="status-item"><span id="today-count">----------</span><span class="last-record" id="last-record"></span></span>
      <span class="status-item status-hint">방을 눌러서 들어가세요</span>
    </header>

    <!-- 건물: 1층(위, #floor-1) · 길 · 2층(아래, #floor-2).
         방(부서)은 app.js의 ROOMS 목록을 보고 buildMap()이 자동으로 만들어 넣는다.
         실제 건물처럼 1층을 아래로 두려면 여기서 두 floor의 순서만 바꾸면 된다.

         buildMap()이 만드는 방 하나의 구조는 이렇다 (HTML만 열어 봐도 알 수 있게 적어 둔다):
           <div class="room open" data-room="ledger" role="button" tabindex="0" style="--floor: #dcefff">
             <span class="room-tag">📒 재무부 · 1명 · [상태 칩]</span>   이름표 (위쪽 테두리에 걸침)
             <div class="room-shelf">창문 · 칠판 · 시계 <div class="room-door">문</div></div>   위쪽 벽 띠
             <div class="room-inside pattern-check">팀장 자리 → 직원 책상 3×2</div>          바닥
             <div class="room-props">화분 · 복사기</div>                                     아래쪽 널빤지 바닥 띠
           </div>
         사장실은 .room-inside 안에 책상 격자 대신 .rug(카펫)가 들어간다. -->
    <div class="building">
      <div class="floor" id="floor-1"></div>
      <div class="road" id="road"></div>
      <div class="floor" id="floor-2"></div>
    </div>

    <!-- 맨 아래 범례: 상태 표시가 무슨 뜻인지. 칩 색은 data-status 값으로 정해진다 -->
    <footer class="legend">
      <span class="legend-item"><span class="chip" data-status="problem">⚠ 문제</span>22시가 지났는데 오늘 기록이 없음</span>
      <span class="legend-item"><span class="chip" data-status="working">💬 근무 중</span>일하는 시간(9~21시), 기록을 기다리는 중</span>
      <span class="legend-item"><span class="chip" data-status="done">✅ 완료</span>오늘 기록을 남김</span>
      <span class="legend-item"><span class="chip" data-status="rest">💤 쉬는 중</span>출근 전(9시 이전) 또는 아직 안 열린 부서</span>
    </footer>
  </section>

  <!-- ===== 화면 2: 재무부 (가계부) ===== -->
  <section id="ledger-screen" class="screen hidden">
    <header class="window-title">
      <button class="back-btn" data-back>◀ 지도</button>
      <span class="window-name">📒 재무부 · 가계부</span>
      <!-- 팀장(나)의 오늘 상태. data-lead-status 가 붙어 있어서 renderStatus()가 채운다 -->
      <span class="pill" id="ledger-status"><b>팀장</b><span class="pill-status" data-lead-status data-status="rest">----</span></span>
    </header>

    <div class="window-body pattern-check">
      <!-- 방 느낌을 내는 장식(벽 띠·팀장 자리). app.js의 buildLedgerDeco()가 그림을 넣는다 -->
      <div class="room-shelf ledger-shelf" id="ledger-shelf"></div>
      <div class="ledger-desk" id="ledger-desk"></div>

      <div class="balance">
        <p class="balance-label">현재 잔액</p>
        <p class="balance-amount" id="balance">0원</p>
      </div>

      <form id="entry-form" class="entry-form">
        <select id="entry-type">
          <option value="expense">지출</option>
          <option value="income">수입</option>
        </select>
        <input type="text" id="entry-title" placeholder="내용 (예: 점심, 월급)" required>
        <input type="number" id="entry-amount" placeholder="금액" min="1" required>
        <button type="submit">추가</button>
      </form>

      <ul id="entry-list" class="entry-list"></ul>
    </div>
  </section>

  <!-- sprites.js(그림)를 먼저 읽고, 그 다음 app.js(동작)를 읽는다 -->
  <script src="sprites.js"></script>
  <script src="app.js"></script>
</body>
</html>
