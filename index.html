<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 1인 회사</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== 화면 1: 회사 지도 ===== -->
  <section id="map-screen" class="screen">
    <header class="sign">
      <h1>나의 1인 회사</h1>
      <p>방을 눌러서 들어가세요</p>
      <!-- 회사 레벨과 경험치. 기록을 남길 때마다 경험치가 쌓인다 -->
      <div class="level-row">
        <span class="level-badge">Lv.<span id="level">1</span></span>
        <div class="xp-bar"><div class="xp-fill" id="xp-fill"></div></div>
        <span class="xp-text" id="xp-text">0 / 100</span>
      </div>
    </header>

    <div class="building">
      <!-- 각 방(부서). data-room 값은 app.js에서 어떤 화면을 열지 정할 때 쓴다 -->
      <button class="room open" data-room="ledger">
        <span class="room-label">재무부</span>
        <span class="room-icon">💰</span>
        <span class="room-desc">가계부 · 잔액</span>
      </button>

      <button class="room locked" data-room="assets">
        <span class="room-label">자산관리부</span>
        <span class="room-icon">🏦</span>
        <span class="room-desc">3단계에서 열림</span>
      </button>

      <button class="room locked" data-room="routine">
        <span class="room-label">인사부</span>
        <span class="room-icon">📋</span>
        <span class="room-desc">루틴 · 5단계</span>
      </button>

      <button class="room locked" data-room="study">
        <span class="room-label">교육부</span>
        <span class="room-icon">📚</span>
        <span class="room-desc">코딩 학습 기록</span>
      </button>

      <button class="room locked" data-room="report">
        <span class="room-label">기획부</span>
        <span class="room-icon">📊</span>
        <span class="room-desc">월별 리포트 · 4단계</span>
      </button>

      <button class="room locked" data-room="ai">
        <span class="room-label">AI 직원실</span>
        <span class="room-icon">🤖</span>
        <span class="room-desc">최종 목표</span>
      </button>
    </div>

    <!-- 복도를 걸어다니는 나(사장) -->
    <div class="hall">
      <div class="player"></div>
    </div>
  </section>

  <!-- ===== 화면 2: 재무부 (가계부) ===== -->
  <section id="ledger-screen" class="screen hidden">
    <header class="window-title">
      <button class="back-btn" data-back>◀ 지도</button>
      <span>재무부 · 가계부</span>
    </header>

    <div class="window-body">
      <div class="balance">
        <p class="balance-label">현재 잔액</p>
        <p class="balance-amount" id="balance">0원</p>
      </div>

      <form id="entry-form" class="entry-form">
        <select id="entry-type">
          <option value="expense">지출</option>
          <option value="income">수입</option>
        </select>
        <input type="text" id="entry-title" placeholder="내용 (예: 점심, 월급)" required>
        <input type="number" id="entry-amount" placeholder="금액" min="1" required>
        <button type="submit">추가</button>
      </form>

      <ul id="entry-list" class="entry-list"></ul>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
